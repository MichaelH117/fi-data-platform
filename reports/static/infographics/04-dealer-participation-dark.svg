company</text><text x="588.0" y="350.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#8ACE00" text-anchor="start">The dealer carries the claims risk</text><text x="588.0" y="378.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#9AA394" text-anchor="start">Controlled foreign reinsurer, Dealer-owned obligor, Non-controlled foreign reinsurer,</text><text x="588.0" y="400.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#9AA394" text-anchor="start">Producer-owned reinsurer, Retrospective</text><text x="588.0" y="430.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="400" fill="#C5CCBF" text-anchor="start">Default dealer share 50% or 100% · ceding fee 0.0% to 2.0% of earned · seasoning 12 or 24 months</text><text x="1516.0" y="320.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#E8ECE4" text-anchor="end">45 entities</text><text x="1516.0" y="348.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#C5CCBF" text-anchor="end">$12,344,763 written</text><path d="M368,477.0 C474,477.0 440,570.0 552,570.0" fill="none" stroke="#2EC4D6" stroke-width="3" marker-end="url(#ar)"/><text x="430.0" y="556.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#E8ECE4" text-anchor="middle">kept</text><path d="M560,486 H1524 L1536,498 V654 H560 Z" fill="#16191A" stroke="#2EC4D6" stroke-width="2"/><rect x="560.0" y="486.0" width="8.0" height="168.0" fill="#2EC4D6" stroke="none" stroke-width="1"/><text x="588.0" y="522.0" font-family="'Barlow Condensed', Bahnschrift, 'Arial Narrow', sans-serif" font-size="27" font-weight="800" fill="#E8ECE4" text-anchor="start">Reserve stays with the obligor</text><text x="588.0" y="552.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#E8ECE4" text-anchor="start">The obligor carries the claims risk</text><text x="588.0" y="580.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#9AA394" text-anchor="start">Profit share only</text><text x="588.0" y="632.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="400" fill="#C5CCBF" text-anchor="start">Default dealer share 50% · ceding fee 0.0% of earned · seasoning 24 months</text><text x="1516.0" y="522.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#E8ECE4" text-anchor="end">15 entities</text><text x="1516.0" y="550.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#C5CCBF" text-anchor="end">$5,110,835 written</text><text x="64.0" y="736.0" font-family="'Barlow Condensed', Bahnschrift, 'Arial Narrow', sans-serif" font-size="24" font-weight="800" fill="#E8ECE4" text-anchor="start">How the dealer's share is worked out: all 60 entities, inception to 2026-09-30</text><text x="348.0" y="793.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="end">Earned reserve</text><rect x="364.0" y="774.0" width="926.0" height="28.0" fill="#8ACE00" stroke="none" stroke-width="1"/><text x="1302.0" y="795.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">$10,198,146</text><text x="348.0" y="845.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="400" fill="#C5CCBF" text-anchor="end">less incurred claims</text><rect x="837.4" y="826.0" width="452.6" height="28.0" fill="#E0529C" stroke="none" stroke-width="1"/><line x1="837.4" y1="854.0" x2="837.4" y2="878.0" stroke="#9AA394" stroke-width="1" stroke-dasharray="3 3"/><text x="1302.0" y="847.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">- $4,984,918</text><text x="348.0" y="897.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="400" fill="#C5CCBF" text-anchor="end">less ceding fee</text><rect x="829.6" y="878.0" width="7.8" height="28.0" fill="#F2A93B" stroke="none" stroke-width="1"/><line x1="829.6" y1="906.0" x2="829.6" y2="930.0" stroke="#9AA394" stroke-width="1" stroke-dasharray="3 3"/><text x="849.4" y="899.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">- $85,577</text><text x="348.0" y="949.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="end">Underwriting result</text><rect x="364.0" y="930.0" width="465.6" height="28.0" fill="#C5CCBF" stroke="none" stroke-width="1"/><text x="841.6" y="951.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">$5,127,652</text><line x1="64.0" y1="970.0" x2="1536.0" y2="970.0" stroke="#2A302B" stroke-width="1"/><text x="348.0" y="1001.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="end">Profit share earned</text><rect x="364.0" y="982.0" width="358.0" height="28.0" fill="#8ACE00" stroke="none" stroke-width="1"/><text x="734.0" y="1003.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">$3,942,564</text><text x="348.0" y="1053.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="400" fill="#C5CCBF" text-anchor="end">already paid out</text><rect x="434.1" y="1034.0" width="287.9" height="28.0" fill="#2EC4D6" stroke="none" stroke-width="1"/><line x1="434.1" y1="1062.0" x2="434.1" y2="1086.0" stroke="#9AA394" stroke-width="1" stroke-dasharray="3 3"/><text x="734.0" y="1055.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">- $3,171,068</text><text x="348.0" y="1105.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="end">Closing due to dealers</text><rect x="364.0" y="1086.0" width="70.1" height="28.0" fill="#C5CCBF" stroke="none" stroke-width="1"/><text x="446.1" y="1107.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#E8ECE4" text-anchor="start">$771,496</text><text x="64.0" y="1160.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="400" fill="#9AA394" text-anchor="start">Underwriting result = earned reserve - incurred claims - ceding fee. Profit share = the dealer's share of a positive result, once seasoned.</text><line x1="64.0" y1="1240.0" x2="1536.0" y2="1240.0" stroke="#2A302B" stroke-width="1"/><text x="64.0" y="1270.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="400" fill="#9AA394" text-anchor="start">Source: finance.mart_cession_experience at the latest closed period (202609), seeds.participation_structure_terms,</text><text x="64.0" y="1292.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="400" fill="#9AA394" text-anchor="start">core.dim_participation_entity_program.</text><text x="1536.0" y="1270.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="400" fill="#9AA394" text-anchor="end">Synthetic data · run 20261026T183720Z</text></svg>