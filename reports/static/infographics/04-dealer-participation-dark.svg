<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1322" viewBox="0 0 1600 1322" role="img" aria-label="Dealer participation: who carries the risk. In 45 of 60 participation deals the claims reserve is ceded and the dealer carries the risk; in the rest it stays with the obligor and the dealer only shares profit."><title>Dealer participation: who carries the risk</title><desc>In 45 of 60 participation deals the claims reserve is ceded and the dealer carries the risk; in the rest it stays with the obligor and the dealer only shares profit. Two-lane flow and a waterfall.</desc><rect x="0.0" y="0.0" width="1600.0" height="1322.0" fill="#0B0D0C" stroke="none" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C5CCBF"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ACE00"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA394"/></marker></defs><path d="M64,48 H232 L242,58 V82 H64 Z" fill="#8ACE00" stroke="none" stroke-width="0"/><text x="78.0" y="71.0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#000000" text-anchor="start">F&amp;IP · FIGURE 4</text><text x="64.0" y="138.0" font-family="'Barlow Condensed', Bahnschrift, 'Arial Narrow', sans-serif" font-size="58" font-weight="800" fill="#E8ECE4" text-anchor="start" letter-spacing="0.3">Dealer participation: who carries the risk</text><text x="64.0" y="182.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="400" fill="#C5CCBF" text-anchor="start">In 45 of 60 participation deals the claims reserve is ceded and the dealer carries the risk; in the rest it</text><text x="64.0" y