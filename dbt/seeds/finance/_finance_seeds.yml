version: 2

# Finance counting rules (docs/V3_DESIGN.md 2.4 Seeds): every rule the statements use lives here,
# never in a code comment or a spreadsheet note.

seeds:
  - name: participation_structure_terms
    description: Statement terms per dealer participation structure (who owns the reserve, dealer share, ceding fee, seasoning).
    config:
      column_types: {structure_type: varchar, owns_claims_reserve: boolean, default_dealer_share_pct: double,
                     ceding_fee_pct: double, min_seasoning_months: integer, notes: varchar}
    columns:
      - name: structure_type
        data_tests: [unique, not_null]
      - name: default_dealer_share_pct
        data_tests:
          - expression_is_true:
              arguments: {expression: "default_dealer_share_pct between 0 and 1"}

  - name: pnl_line_map
    description: Maps each cost-split bucket (disbursement_type) to a P&L line and group.
    config:
      column_types: {disbursement_type: varchar, pnl_line: varchar, pnl_group: varchar, sort_order: integer, notes: varchar}
    columns:
      - name: disbursement_type
        data_tests: [unique, not_null]
      - name: pnl_group
        data_tests:
          - accepted_values:
              arguments: {values: [RESERVE, ADMIN, ACQUISITION, PROFIT_SHARE]}

  - name: remit_aging_buckets
    description: Remittance aging buckets (days from contract entry to cash receipt).
    config:
      column_types: {aging_bucket: varchar, min_days: integer, max_days: integer, sort_order: integer, notes: varchar}
    columns:
      - name: aging_bucket
        data_tests: [unique, not_null]

  - name: control_tolerances
    description: Tolerances for the finance close controls (mart_disbursement_control_totals).
    config:
      column_types: {control_id: varchar, tolerance: double, notes: varchar}
    columns:
      - name: control_id
        data_tests: [unique, not_null]

  - name: profit_share_payout_schedule
    description: >
      When profit share is paid out per structure: once a year in payout_month, the share earned up
      to the prior December (never paid twice; a later drop in the share is not clawed back here, it
      shows as a negative closing balance until future surplus covers it).
    config:
      column_types: {structure_type: varchar, payout_month: integer, notes: varchar}
    columns:
      - name: structure_type
        data_tests: [unique, not_null]
      - name: payout_month
        data_tests:
          - expression_is_true:
              arguments: {expression: "payout_month between 1 and 12"}

  - name: term_year_buckets
    description: >
      Term-year buckets for the New Reserves page (V6 edit 11): contract term in months -> bucket
      (0-1 year = 0..12 months, 1-2 = 13..24, ...). Contiguous and covering every term.
    config:
      column_types: {term_bucket: varchar, bucket_label: varchar, min_months: integer, max_months: integer,
                     sort_order: integer}
    columns:
      - name: term_bucket
        data_tests: [unique, not_null]
      - name: sort_order
        data_tests: [unique, not_null]

  - name: commission_volume_targets
    description: >
      Commission hierarchy input (V6 edit 12): the monthly contract volume target per district x product
      type (product category). Over(+) / Under(-) is measured against it. District -> region is
      dim_agent's (seeds/core/agent_territory_hierarchy.csv).
    config:
      column_types: {district: varchar, product_type: varchar, monthly_target_contracts: integer}
    data_tests:
      - unique_combination:
          arguments: {columns: [district, product_type]}
    columns:
      - name: monthly_target_contracts
        data_tests:
          - expression_is_true:
              arguments: {expression: "monthly_target_contracts >= 0"}

  - name: cancel_mileage_bands
    description: >
      V7 edit 36: bands of miles left on a cancelled contract (term miles - (odometer at cancel -
      odometer at sale)). is_near_limit marks the bands the near-limit section counts. Bands do not
      overlap and cover every whole number of miles.
    config:
      column_types: {band_id: varchar, band_label: varchar, min_miles_remaining: integer,
                     max_miles_remaining: integer, sort_order: integer, is_near_limit: boolean, notes: varchar}
    columns:
      - name: band_id
        data_tests: [unique, not_null]
      - name: sort_order
        data_tests: [unique, not_null]
