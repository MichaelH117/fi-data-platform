# Governed metric definitions (dbt Semantic Layer / MetricFlow spec).
# Single source of truth together with docs/METRICS.md. The gold marts precompute the same
# formulas; tests/assert_loss_ratio_math.sql checks the two agree.

semantic_models:
  - name: contract_month
    description: Contract x month earning and claims (gold.fct_contract_monthly).
    model: ref('fct_contract_monthly')
    config: {meta: {pbi: {table: Contract Month, domains: [Finance, Claims]}}}
    defaults: {agg_time_dimension: month_start}
    entities:
      - {name: contract_month, type: primary, expr: contract_month_key}
      - {name: contract, type: foreign, expr: contract_id}
      - {name: dealer, type: foreign, expr: dealer_code}
      - {name: product, type: foreign, expr: product_code}
    dimensions:
      - {name: month_start, type: time, type_params: {time_granularity: month}}
      - {name: sale_month, type: time, type_params: {time_granularity: month}}
      - {name: new_used, type: categorical}
    measures:
      - {name: written_premium, agg: sum, description: Reserve premium booked in the sale month.}
      - {name: earned_premium, agg: sum, description: Pro-rata earned reserve premium.}
      - {name: incurred_claims, agg: sum, description: "Paid + case reserve on open claims, by loss month."}
      - {name: paid_claims, agg: sum}
      - {name: claim_count, agg: sum, description: "Non-denied claims, by loss month."}
      - {name: exposure_years, agg: sum, description: Earned contract-years (days in force / 365.25).}
      - name: contracts_in_force
        agg: sum_boolean
        expr: is_in_force_eom
        description: Contracts in force at month end (a balance, so it never sums across months).
        non_additive_dimension: {name: month_start, window_choice: max}
      - name: unearned_premium_balance
        agg: sum
        expr: unearned_premium_eom
        description: Unearned reserve premium at month end (a balance, so it never sums across months).
        non_additive_dimension: {name: month_start, window_choice: max}

  - name: contract_sale
    description: One row per contract sold (gold.fct_contract_sale).
    model: ref('fct_contract_sale')
    defaults: {agg_time_dimension: sale_date}
    entities:
      - {name: contract, type: primary, expr: contract_id}
      - {name: dealer, type: foreign, expr: dealer_code}
      - {name: product, type: foreign, expr: product_code}
    dimensions:
      - {name: sale_date, type: time, type_params: {time_granularity: day}}
      - {name: new_used, type: categorical}
      - {name: contract_status, type: categorical}
    measures:
      - {name: contracts_sold, agg: count, expr: contract_id}
      - {name: contracts_cancelled, agg: sum, expr: "case when is_cancelled then 1 else 0 end"}
      - {name: dealer_markup, agg: sum}

  - name: claim
    description: One row per valid claim (gold.fct_claim).
    model: ref('fct_claim')
    defaults: {agg_time_dimension: loss_date}
    entities:
      - {name: claim, type: primary, expr: claim_id}
      - {name: contract, type: foreign, expr: contract_id}
    dimensions:
      - {name: loss_date, type: time, type_params: {time_granularity: day}}
      - {name: claim_status, type: categorical}
      - {name: repair_category, type: categorical}
    measures:
      - {name: claims_reported, agg: count, expr: claim_id}
      - {name: paid_claim_count, agg: sum, expr: "case when claim_status = 'paid' then 1 else 0 end"}
      - {name: claim_paid_amount, agg: sum, expr: paid_amount}

  # ---------------------------------------------------------------- V3 core facts (posting-period grain)
  # The Power BI generator (python -m semantic) reads config.meta.pbi: the Power BI table name and
  # the domain models (Sales, Claims, Finance, Compliance) that carry the table.
  - name: gross_premium
    description: Contract x posting period of sale or amendment (core.fct_gross_premium).
    model: ref('fct_gross_premium')
    config: {meta: {pbi: {table: Gross Premium, domains: [Sales, Finance, Compliance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: gross_premium_line, type: primary, expr: "contract_key || '|' || cast(posting_period_key as varchar)"}
      - {name: contract_key, type: foreign, expr: contract_key}
      - {name: dealer_key, type: foreign, expr: dealer_key}
      - {name: product_key, type: foreign, expr: product_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
    measures:
      - {name: contracts_written, agg: sum, description: Contracts written (sales only; amendments add 0).}
      - {name: gross_coverage_cost, agg: sum, expr: coverage_cost, description: Gross consideration on the coverage-cost basis.}
      - {name: gross_retail_price, agg: sum, expr: retail_price, description: Gross consideration on the retail basis.}
      - {name: gross_purchase_price, agg: sum, expr: purchase_price}

  - name: cancellation
    description: One row per cancellation, posted to its posting period (core.fct_cancellation).
    model: ref('fct_cancellation')
    config: {meta: {pbi: {table: Cancellation, domains: [Sales, Finance, Compliance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: cancel_key, type: primary, expr: cancel_key}
      - {name: contract_key, type: foreign, expr: contract_key}
      - {name: dealer_key, type: foreign, expr: dealer_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
      - {name: cancel_method, type: categorical, expr: method}
    measures:
      - {name: cancellations, agg: count, expr: cancel_key}
      - {name: effective_cancellations, agg: sum_boolean, expr: is_effective_cancel, description: Cancels not later reinstated.}
      - {name: customer_refunds, agg: sum, expr: customer_refund}
      - {name: cancel_fees, agg: sum, expr: cancel_fee}
      - {name: dealer_chargebacks, agg: sum, expr: dealer_portion, description: Dealer portion of the refund (chargeback).}
      - {name: coverage_cost_refunds, agg: sum, expr: coverage_cost_refund}

  - name: reinstatement
    description: One row per reinstatement (core.fct_reinstatement).
    model: ref('fct_reinstatement')
    config: {meta: {pbi: {table: Reinstatement, domains: [Finance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: reinstatement_key, type: primary, expr: reinstatement_key}
      - {name: contract_key, type: foreign, expr: contract_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
    measures:
      - {name: reinstatements, agg: count, expr: reinstatement_key}
      - {name: reinstatement_reversals, agg: sum, expr: reversal_amount}

  - name: claim_payment_line
    description: THE claims fact at payment-line grain (core.fct_claim_payment_line).
    model: ref('fct_claim_payment_line')
    config: {meta: {pbi: {table: Claim Payment Line, domains: [Claims, Finance, Compliance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: line_key, type: primary, expr: line_key}
      - {name: claim_key, type: foreign, expr: claim_key}
      - {name: contract_key, type: foreign, expr: contract_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
      - {name: line_type, type: categorical}
      - {name: age_bin, type: categorical}
    measures:
      - {name: claims_paid, agg: sum, expr: paid_amount, description: Claim dollars paid (always positive after conforming).}
      - {name: claims_incurred, agg: sum, expr: incurred_change, description: Paid plus change in case reserve (as posted).}
      - {name: claims_reserve_change, agg: sum, expr: pending_amount, description: Change in outstanding case reserve.}
      - {name: claims_with_activity, agg: count_distinct, expr: claim_key}
      - {name: avg_claim_process_days, agg: average, expr: process_days}

  - name: claim_history
    description: >-
      Claim status changes, as posted (core.fct_claim_history). Admin core only (status history starts at
      the 2023 cutover; legacy claims have none), so claim COUNTS come from claim_summary, never from here.
    model: ref('fct_claim_history')
    config: {meta: {pbi: {table: Claim History, domains: [Claims, Compliance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: claim_history_key, type: primary, expr: claim_history_key}
      - {name: claim_key, type: foreign, expr: claim_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
      - {name: to_status, type: categorical}
    measures:
      - {name: collected_deductibles, agg: sum, expr: collected_deductible}

  - name: claim_summary
    description: >-
      One row per claim from BOTH admin systems (claims.mart_claim_summary), the same population as
      fct_claim_payment_line and the site's claims KPIs. Dated by loss month (the KPI basis); the
      reported month is a role-playing date (config.meta.pbi.date_role) for intake counts.
    model: ref('mart_claim_summary')
    config: {meta: {pbi: {table: Claim Summary, domains: [Claims, Finance, Compliance]}}}
    defaults: {agg_time_dimension: loss_month}
    entities:
      - {name: claim_key, type: primary, expr: claim_key}
      - {name: contract_key, type: foreign, expr: contract_key}
      - {name: dealer_key, type: foreign, expr: dealer_key}
    dimensions:
      - {name: loss_month, type: time, type_params: {time_granularity: month}}
      - {name: reported_month, type: time, type_params: {time_granularity: month}}
      - {name: status_group, type: categorical}
    measures:
      - {name: claims_opened, agg: count, expr: claim_key, description: "Claims reported (both systems)."}
      - {name: claims_reported_loss_month, agg: count, expr: claim_key, description: "Claims reported, by loss month."}
      - {name: claims_denied, agg: sum, expr: "case when status_group = 'denied' then 1 else 0 end"}
      - {name: claims_closed_paid, agg: sum, expr: "case when status_group = 'paid' then 1 else 0 end"}
      - {name: paid_on_paid_claims, agg: sum, expr: "case when status_group = 'paid' then paid_amount else 0 end"}
      - {name: open_claims, agg: sum, expr: "case when status_group = 'open' then 1 else 0 end", description: Claims open as of the as-of date.}
      - {name: open_claims_aged_30_plus, agg: sum_boolean, expr: is_aged_open, description: "Open claims reported more than 30 days before the as-of date (seed open_aging_threshold_days)."}
      - {name: avg_claim_turnaround_days, agg: average, expr: turnaround_days, description: "Reported to closed, closed claims only (open claims have no turnaround)."}

  - name: dealer_scorecard
    description: Dealer x month scorecard (dealer.mart_dealer_scorecard), the site's watchlist and early-claim source.
    model: ref('mart_dealer_scorecard')
    config: {meta: {pbi: {table: Dealer Scorecard, domains: [Sales]}}}
    defaults: {agg_time_dimension: month_start}
    entities:
      - {name: dealer_month, type: primary, expr: "dealer_key || '|' || cast(month_key as varchar)"}
      - {name: dealer_key, type: foreign, expr: dealer_key}
    dimensions:
      - {name: month_start, type: time, type_params: {time_granularity: month}}
    measures:
      - {name: scorecard_claims_reported, agg: sum, expr: claims_reported}
      - {name: scorecard_early_claims, agg: sum, expr: early_claims, description: "Claims within the headline early-claim window (seed early_claim_headline_days)."}
      - name: dealers_on_watch
        agg: sum_boolean
        expr: is_watch
        description: Dealers on the watchlist in the month (a balance, so it never sums across months).
        non_additive_dimension: {name: month_start, window_choice: max}
      - name: dealers_on_loss_ratio_watch
        agg: sum_boolean
        expr: is_watch_loss_ratio
        description: Dealers on the loss-ratio watch in the month (a balance, so it never sums across months).
        non_additive_dimension: {name: month_start, window_choice: max}
      # Monthly additive columns: the scorecard ratios are built from these, so the T12M calculation item
      # gives the trailing-12 view (the mart's rolling t12_* columns are not imported).
      - {name: scorecard_contracts_written, agg: sum, expr: contracts_written, description: "Contracts written in the month (entered-month cohort)."}
      - {name: scorecard_contracts_cancelled, agg: sum, expr: contracts_cancelled, description: "Of the contracts written in the month, those since cancelled (sale cohort)."}
      - {name: scorecard_earned_claims_reserve, agg: sum, expr: earned_claims_reserve, description: "Earned claims reserve by earned month (the scorecard loss-ratio denominator)."}
      - {name: scorecard_incurred_claims, agg: sum, expr: incurred_claims, description: "Incurred claims by loss month."}
      - {name: scorecard_remittances, agg: sum, expr: remittances}
      - {name: scorecard_late_remittances, agg: sum, expr: late_remittances}
      - {name: scorecard_days_late_total, agg: sum, expr: days_late_total, description: "Days past the late threshold, summed over late remittances."}
      - name: scorecard_loss_ratio_peer_pct
        agg: max
        expr: t12_loss_ratio_peer_pct
        description: Peer percentile of the dealer's trailing-12 loss ratio at month end (a rank, so never aggregated).
        non_additive_dimension: {name: month_start, window_choice: max}

  - name: funded_reserve_filing
    description: >-
      Funded-reserve filing lines (regulatory.mart_funded_reserve_summary): state x provider x scope
      (ITD | PERIOD) x basis x filing window. Measures read the state's default basis only; slice Scope
      and Period Label, never sum across windows.
    model: ref('mart_funded_reserve_summary')
    config: {meta: {pbi: {table: Funded Reserve Filing, domains: [Compliance]}}}
    defaults: {agg_time_dimension: period_end}
    entities:
      - {name: filing_line_key, type: primary, expr: filing_line_key}
      - {name: provider_key, type: foreign, expr: provider_key}
    dimensions:
      - {name: period_end, type: time, type_params: {time_granularity: day}}
      - {name: scope, type: categorical}
      - {name: basis, type: categorical}
    measures:
      - {name: filing_calculated_reserve, agg: sum, expr: "case when is_default_basis then calculated_reserve else 0 end"}
      - {name: filing_current_reserve, agg: sum, expr: "case when is_default_basis then current_reserve else 0 end"}
      - {name: filing_reserve_shortfall, agg: sum, expr: "case when is_default_basis then reserve_shortfall else 0 end"}
      - {name: filing_complaints_received, agg: sum, expr: "case when is_default_basis then complaints_received else 0 end"}

  - name: regulatory_line_value
    description: Every filed line value (regulatory.mart_regulatory_line_values), funded reserve and market survey.
    model: ref('mart_regulatory_line_values')
    config: {meta: {pbi: {table: Regulatory Line Value, domains: [Compliance]}}}
    defaults: {agg_time_dimension: window_end}
    entities:
      - {name: regulatory_line, type: primary, expr: "report_id || '|' || state || '|' || window_id || '|' || provider_key || '|' || line_item"}
      - {name: provider_key, type: foreign, expr: provider_key}
    dimensions:
      - {name: window_end, type: time, type_params: {time_granularity: day}}
      - {name: report_id, type: categorical}
      - {name: line_item, type: categorical}
    measures:
      - {name: filing_line_value, agg: sum, expr: value, description: "The filed value; slice to one report, window and line first."}

  - name: cash_transaction
    description: Remittance cash with the entered -> sent -> received lifecycle (core.fct_cash_transaction).
    model: ref('fct_cash_transaction')
    config: {meta: {pbi: {table: Cash Transaction, domains: [Finance, Sales]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: cash_txn_key, type: primary, expr: cash_txn_key}
      - {name: contract_key, type: foreign, expr: contract_key}
      - {name: dealer_key, type: foreign, expr: dealer_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
    measures:
      - {name: remitted_cash, agg: sum, expr: amount}
      - {name: remittances, agg: count, expr: cash_txn_key}
      - {name: late_remittances, agg: sum_boolean, expr: is_late}
      - {name: late_fees, agg: sum, expr: late_fee}
      - {name: avg_remit_age_days, agg: average, expr: remit_age_days}

  - name: disbursement
    description: Transaction x disbursement type x account holder (core.fct_disbursement).
    model: ref('fct_disbursement')
    config: {meta: {pbi: {table: Disbursement, domains: [Finance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: disbursement_key, type: primary, expr: disbursement_key}
      - {name: contract_key, type: foreign, expr: contract_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
      - {name: disbursement_type, type: categorical}
    measures:
      - {name: disbursed_amount, agg: sum, expr: amount}
      - {name: disbursed_claims_reserve, agg: sum, expr: reserve_amount}
      - {name: disbursed_profit_share_reserve, agg: sum, expr: profit_share_reserve}

  - name: earned_disbursement
    description: Contract x disbursement type x posting period earned (core.fct_earned_disbursement).
    model: ref('fct_earned_disbursement')
    config: {meta: {pbi: {table: Earned Disbursement, domains: [Finance]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - name: earned_disbursement_line
        type: primary
        expr: "contract_key || '|' || disbursement_type || '|' || cast(posting_period_key as varchar)"
      - {name: contract_key, type: foreign, expr: contract_key}
    dimensions:
      - {name: posting_period, type: time, expr: month_start, type_params: {time_granularity: month}}
    measures:
      - {name: earned_disbursement_amount, agg: sum, expr: earned_amount}
      - {name: earned_reserve, agg: sum}
      # pnl_group ADMIN / ACQUISITION from seed pnl_line_map (tests/test_semantic.py checks the lists match).
      - {name: earned_admin_fee, agg: sum, expr: "case when disbursement_type = 'ADMIN_FEE' then earned_amount else 0 end"}
      - name: earned_acquisition_cost
        agg: sum
        expr: "case when disbursement_type in ('COMMISSION', 'INSURER_FEE', 'PREMIUM_TAX') then earned_amount else 0 end"

  - name: commission
    description: Agent commissions (core.fct_commission).
    model: ref('fct_commission')
    config: {meta: {pbi: {table: Commission, domains: [Finance, Sales]}}}
    defaults: {agg_time_dimension: posting_period}
    entities:
      - {name: commission_key, type: primary, expr: commission_key}
      - {name: contract_key, type: foreign, expr: contract_key}
    dimensions:
      - name: posting_period
        type: time
        expr: "make_date(cast(posting_period_key / 100 as integer), cast(posting_period_key % 100 as integer), 1)"
        type_params: {time_granularity: month}
    measures:
      - {name: commissions, agg: sum, expr: amount}
      - {name: commission_advances, agg: sum, expr: "case when is_advance then amount else 0 end"}

# Governance (config.meta, checked by tests/test_semantic.py): every metric names an owner (a role
# title from docs/V3_DESIGN.md) and certified: true | false. A certified metric is the one definition
# of record for an executive or site headline KPI: it carries a description and definition_of_record
# (a docs/METRICS.md section), and every headline tile maps to one (semantic/spec.py HEADLINE_KPIS).
metrics:
  - name: written_premium
    label: Written premium
    type: simple
    type_params: {measure: written_premium}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {folder: Premium}}}

  - name: earned_premium
    label: Earned premium (pro-rata)
    type: simple
    type_params: {measure: earned_premium}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {folder: Premium}}}

  - name: incurred_claims
    label: Incurred claims
    type: simple
    type_params: {measure: incurred_claims}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {name: Incurred Claims (accident month), folder: Claims}}}

  - name: loss_ratio
    label: Loss ratio (on earned premium)
    description: Incurred claims divided by EARNED premium (never written). Not comparable with the loss ratio on claims reserve.
    type: ratio
    type_params: {numerator: incurred_claims, denominator: earned_premium}
    config: {meta: {owner: "Data Scientist", certified: true, definition_of_record: "docs/METRICS.md#loss-ratios", pbi: {name: Loss Ratio (on earned premium), folder: Ratios}}}

  - name: t12_earned_premium
    label: Earned premium, trailing 12 months
    type: cumulative
    type_params: {measure: earned_premium, cumulative_type_params: {window: 12 months}}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {calculation_item: T12M, base_metric: earned_premium}}}

  - name: t12_incurred_claims
    label: Incurred claims, trailing 12 months
    type: cumulative
    type_params: {measure: incurred_claims, cumulative_type_params: {window: 12 months}}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {calculation_item: T12M, base_metric: incurred_claims}}}

  - name: t12_loss_ratio
    label: Loss ratio (on earned premium), trailing 12 months
    type: derived
    type_params:
      expr: t12_incurred_claims / t12_earned_premium
      metrics: [{name: t12_incurred_claims}, {name: t12_earned_premium}]
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {calculation_item: T12M, base_metric: loss_ratio}}}

  - name: claim_frequency
    label: Claim frequency (claims per earned contract-year)
    description: "Non-denied claims per earned contract-year, accident-month basis (claims page tile)."
    type: ratio
    type_params:
      numerator: {name: claim_count_metric}
      denominator: {name: exposure_years_metric}
    config: {meta: {owner: "Data Scientist", certified: true, definition_of_record: "docs/METRICS.md#claims", pbi: {format: decimal, folder: Ratios, domains: [Claims, Finance]}}}

  - name: claim_count_metric
    label: Claims (non-denied)
    type: simple
    type_params: {measure: claim_count}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {name: Claim Count (accident month), format: integer, folder: Claims}}}

  - name: exposure_years_metric
    label: Earned contract-years
    type: simple
    type_params: {measure: exposure_years}
    config: {meta: {owner: "Data Scientist", certified: false, pbi: {name: Exposure Years, format: decimal, folder: Exposure}}}

  - name: paid_claim_count
    label: Paid claims
    type: simple
    type_params: {measure: paid_claim_count}
    config: {meta: {owner: "Senior Data Analyst (dealer & claims)", certified: false}}

  - name: claim_paid_amount
    label: Claim dollars paid
    type: simple
    type_params: {measure: claim_paid_amount}
    config: {meta: {owner: "Senior Data Analyst (dealer & claims)", certified: false}}

  - name: claim_severity
    label: Claim severity (paid per paid claim)
    type: ratio
    type_params: {numerator: claim_paid_amount, denominator: paid_claim_count}
    config: {meta: {owner: "Senior Data Analyst (dealer & claims)", certified: false}}

  - name: contracts_sold
    label: Contracts sold
    type: simple
    type_params: {measure: contracts_sold}
    config: {meta: {owner: "Senior Data Analyst (dealer & claims)", certified: false}}

  - name: contracts_cancelled
    label: Contracts cancelled
    type: simple
    type_params: {measure: contracts_cancelled}
    config: {meta: {owner: "Senior Data Analyst (dealer & claims)", certified: false}}

  - name: cancel_rate
    label: Cancel rate (cancelled / sold, by sale date)
    description: "Contracts cancelled so far / contracts sold, by sale cohort (executive overview tile). Not the period view: see effective_cancel_rate."
    type: ratio
    type_params: {numerator: contracts_cancelled, denominator: contracts_sold}
