version: 2

# Core star schema (schema `core`). Build new work on these models only.
# Every financial fact carries posting_period_key (INTEGER yyyymm, FK to dim_posting_period).
# Only reportable rows are here: demo dealers and test ranges are removed once, in
# intermediate.int_reportable_scope. Unknown members use key '-1'.
# Dims and facts with declared keys (enforced contracts, PK, relationships) live in _core_keys.yml.

models:
  - name: mart_migration_parallel_run
    description: >
      Migration parallel run at cutover: the same claims and contracts counted in the legacy system
      and in Admin Core (rows, dollars, difference, documented exclusion, status).
    data_tests:
      - unique_combination:
          arguments: {columns: [entity, posting_period_key]}
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [TIED, TIED_AFTER_EXCLUSIONS, NOT_MIGRATED, BREAK]

  - name: mart_claim_contact_by_dealer
    description: >
      Call-center contacts per claim, by dealer and claim-reported month, from the CRM go-live:
      claim_contact_rate = claims_contacted / claims_reported, repeat_contact_rate =
      repeat_contact_claims / claims_contacted, contacts_per_claim = claim_status_contacts /
      claims_reported. Ties to fct_call_center_contact (dbt/tests/reconciliation/recon_call_contacts_tie.sql).
    data_tests:
      - unique_combination:
          arguments: {columns: [dealer_key, reported_month]}
      - expression_is_true:
          arguments: {expression: "claims_contacted <= claims_reported and repeat_contact_claims <= claims_contacted"}
    columns:
      - name: dealer_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_dealer'), field: dealer_key}

  - name: mart_intake_quarantine
    description: >
      One row per rejected intake row, all sources: reject reason and control family, the row's
      business key, and its resolution (replayed = key later accepted from a corrected or re-sent
      file; duplicate_dropped = an accepted copy exists; recovered = legacy row replayed by staging;
      open = still missing). Feeds the data quality page.
    columns:
      - name: reject_row_key
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: [network_feed, crm, admin_api, legacy_admin]
      - name: resolution_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [replayed, duplicate_dropped, recovered, open]
