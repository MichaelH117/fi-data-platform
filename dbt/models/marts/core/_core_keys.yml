- name: dim_contract
  description: Contract core, one row per reportable contract from both systems, plus '-1'.
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [contract_key]
  columns:
  - name: contract_key
    data_type: varchar
    description: md5('<source_system>|<source contract id>') (int_contract_key_bridge).
    data_tests: [unique, not_null]
  - {name: contract_number, data_type: varchar}
  - {name: source_system, data_type: varchar}
  - {name: source_contract_id, data_type: varchar}
  - name: status
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [PENDING, INFORCE, CANCELLED, EXPIRED, VOIDED, DENIED, SUSPENDED, REINSTATEMENT_PENDING,
                   REINSTATEMENT_SUSPENDED, REINSTATEMENT_VOIDED, REINSTATEMENT_DENIED]
        config: {where: contract_key <> '-1'}
  - {name: entered_date, data_type: date}
  - {name: entered_date_key, data_type: integer}
  - {name: effective_date, data_type: date}
  - {name: effective_date_key, data_type: integer}
  - {name: expiration_date, data_type: date}
  - {name: expiration_date_key, data_type: integer}
  - {name: entered_year, data_type: bigint}
  - name: dealer_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_dealer'), field: dealer_key}
  - {name: dealer_number, data_type: varchar}
  - name: agent_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_agent'), field: agent_key}
  - name: product_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_product'), field: product_key}
  - {name: product_code, data_type: varchar}
  - {name: subcategory_code, data_type: varchar}
  - {name: category_code, data_type: varchar}
  - {name: plan_year, data_type: bigint}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: reportable_state, data_type: varchar}
  - name: original_obligor_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_obligor'), field: obligor_key}
  - name: current_obligor_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_obligor'), field: obligor_key}
  - name: selling_dealer_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_producer'), field: producer_key}
  - name: provider_entity_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_producer'), field: producer_key}
  - name: obligor_basis
    data_type: varchar
    description: SOURCE (obligor on the record), CONVERSION_STATE_MAP (legacy book, mapped at conversion) or MISSING.
    data_tests:
    - accepted_values:
        arguments:
          values: [SOURCE, CONVERSION_STATE_MAP, MISSING]
        config: {where: contract_key <> '-1'}
  - name: insurer_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_insurer'), field: insurer_key}
  - {name: customer_key, data_type: varchar}
  - {name: deal_id, data_type: varchar}
  - {name: cancel_date, data_type: date}
  - {name: cancel_date_key, data_type: integer}
  - {name: is_cancelled, data_type: boolean}
  - {name: is_dealer_code_missing, data_type: boolean}
  - {name: is_recovered_from_quarantine, data_type: boolean}
  - {name: updated_at, data_type: timestamp}
  - {name: _loaded_at, data_type: timestamp}
  - {name: _built_at, data_type: timestamp with time zone}
