- name: fct_earned_disbursement
  description: 'Contract x disbursement type x posting period x earned month (pro-rata default, R78 via var), plus
    a cancel true-up in the cancel''s posting period so earned + refunded = written once cancelled. Earning a month
    already closed when the contract activated is booked in the first open period (earned_month_key keeps the true
    month); a VOID after activation posts a reversal. Closed periods are never restated (test core_earned_never_restates_closed_periods).

    '
  data_tests:
  - unique_combination:
      arguments:
        columns: [contract_key, disbursement_type, posting_period_key, earned_month_key]
  columns:
  - name: contract_key
    data_tests:
    - relationships:
        arguments: {to: ref('dim_contract'), field: contract_key}
  - name: dealer_key
    data_tests:
    - relationships:
        arguments: {to: ref('dim_dealer'), field: dealer_key}
  - name: product_key
    data_tests:
    - relationships:
        arguments: {to: ref('dim_product'), field: product_key}
  - name: tenant_key
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: disbursement_type}
  - name: posting_period_key
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_posting_period'), field: posting_period_key}
  - {name: posting_period_start_date}
  - {name: month_start}
  - name: earned_month_key
    data_tests:
    - not_null
    - expression_is_true:
        arguments: {expression: earned_month_key <= posting_period_key}
