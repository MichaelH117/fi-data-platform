version: 2

# Core models with DECLARED KEYS (docs/V3_DESIGN.md 8.4). Every dim and fact here has an enforced
# dbt model contract: the column list and types below are checked before the table is built, and the
# primary_key constraint is created in DuckDB (the build fails on a duplicate or NULL key). Every
# foreign-key column carries a relationships test to its dimension; warehouse/postgres/sync.py turns
# the same tests into real, validated FOREIGN KEY constraints in Postgres.
# fct_contract_monthly and fct_earned_disbursement (the two big facts) keep tests without a DuckDB
# contract (an index build on millions of md5 keys would cost build time); Postgres enforces their keys.
# Adding a column to one of these models: add it here too (name + data_type), or the build stops.

models:
- name: dim_date
  description: Calendar day dimension and the MetricFlow time spine.
  time_spine: {standard_granularity_column: date_day}
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [date_key]
  columns:
  - name: date_key
    data_type: integer
    data_tests: [unique, not_null]
  - name: date_day
    data_type: date
    granularity: day
    data_tests: [unique, not_null]
  - {name: date, data_type: date}
  - {name: month_start, data_type: date}
  - {name: quarter_start, data_type: date}
  - {name: posting_period_key, data_type: integer}
  - {name: year, data_type: bigint}
  - {name: quarter, data_type: bigint}
  - {name: month, data_type: bigint}
  - {name: month_name, data_type: varchar}
  - {name: year_month, data_type: varchar}
  - {name: fiscal_year, data_type: bigint}
  - {name: fiscal_quarter, data_type: bigint}
  - {name: iso_day_of_week, data_type: bigint}
  - {name: is_weekend, data_type: boolean}
  - {name: is_month_end, data_type: boolean}
- name: dim_posting_period
  description: Accounting months with close date and is_closed (period lock, docs/V3_DESIGN.md 2.5).
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [posting_period_key]
  columns:
  - name: posting_period_key
    data_type: integer
    data_tests: [unique, not_null]
  - {name: period_start, data_type: date}
  - {name: period_end, data_type: date}
  - {name: close_date, data_type: date}
  - {name: is_closed, data_type: boolean}
  - {name: fiscal_year, data_type: bigint}
  - {name: fiscal_quarter, data_type: bigint}
  - {name: fiscal_month, data_type: bigint}
  - {name: period_label, data_type: varchar}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_tenant
  description: White-label administrators and their branding (tenant_key = Admin Core tenant_id).
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [tenant_key]
  columns:
  - name: tenant_key
    data_type: bigint
    data_tests: [unique, not_null]
  - name: tenant_code
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: reportable_name, data_type: varchar}
  - {name: logo_path, data_type: varchar}
  - {name: primary_color, data_type: varchar}
  - {name: secondary_color, data_type: varchar}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_dealer
  description: 'Current dealer rows (history in snapshots.snap_dealer); demo dealers excluded; ''-1'' = unknown.
    Dealer participation (who carries the risk) comes from dim_participation_entity, the same entities finance''s
    cession / experience mart reports; reinsurance_company is a legacy free-text attribute kept for lineage only.

    '
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [dealer_key]
  columns:
  - name: dealer_key
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: dealer_id, data_type: bigint}
  - name: dealer_number
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: dealer_name, data_type: varchar}
  - {name: city, data_type: varchar}
  - {name: state, data_type: varchar}
  - {name: dealer_status, data_type: varchar}
  - {name: onboarded_date, data_type: date}
  - name: dealer_group_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_dealer_group'), field: dealer_group_key}
  - name: agent_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_agent'), field: agent_key}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: remit_rule, data_type: varchar}
  - {name: is_weekly_remit, data_type: boolean}
  - {name: program, data_type: varchar}
  - {name: reinsurance_company, data_type: varchar, description: LEGACY admin-system free text (not a finance participation
      entity). Lineage only.}
  - {name: source_system, data_type: varchar}
  - {name: valid_from, data_type: timestamp}
  - {name: is_current, data_type: boolean}
  - name: participation_entity_key
    data_type: varchar
    description: The dealer's participation entity (NULL = no dealer participation).
    data_tests:
    - relationships:
        arguments: {to: ref('dim_participation_entity'), field: participation_entity_key}
    - relationships:
        name: dim_dealer_participation_in_cession_experience
        arguments: {to: ref('mart_cession_experience'), field: participation_entity_key}
  - {name: participation_entity_name, data_type: varchar}
  - name: participation_structure
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [DEALER_OWNED_OBLIGOR, CFC, NCFC, PORC, RETRO, PROFIT_SHARE]
  - name: participation_label
    data_type: varchar
    description: 'Display label: ''<entity name>, <structure>'', or ''no dealer participation''. Never NULL.'
    data_tests: [not_null]
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_dealer_group
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [dealer_group_key]
  columns:
  - name: dealer_group_key
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: dealer_group_id, data_type: bigint}
  - {name: group_code, data_type: varchar}
  - {name: group_name, data_type: varchar}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_agent
