    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: has_advance_agreement, data_type: boolean}
  - {name: sub_agent, data_type: varchar}
  - name: agent_category
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments: {values: [ADVANCE, STANDARD]}
  - {name: district, data_type: varchar, data_tests: [not_null]}
  - {name: region, data_type: varchar, data_tests: [not_null]}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_product
