  - {name: plan_id, data_type: bigint}
  - {name: program_id, data_type: bigint}
  - {name: product_id, data_type: bigint}
  - {name: category_code, data_type: varchar}
  - {name: category, data_type: varchar}
  - {name: subcategory_code, data_type: varchar}
  - {name: subcategory, data_type: varchar}
  - {name: product_code, data_type: varchar}
  - {name: product, data_type: varchar}
  - {name: plan_code, data_type: varchar}
  - {name: plan, data_type: varchar}
  - {name: program_code, data_type: varchar}
  - {name: program, data_type: varchar}
  - {name: plan_year, data_type: bigint}
  - {name: model_year, data_type: integer}
  - {name: program_suffix, data_type: varchar}
