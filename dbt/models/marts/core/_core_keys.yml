    columns: [user_key]
  columns:
  - name: user_key
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: user_login, data_type: varchar}
  - {name: role, data_type: varchar}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: tenant_code, data_type: varchar}
  - name: dealer_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_dealer'), field: dealer_key}
  - {name: dealer_number, data_type: varchar}
  - {name: _built_at, data_type: timestamp with time zone}
- name: fct_call_center_contact
  description: 'Call-center contacts from the CRM export, one row per call_id. Contract resolved by contract number,
    else a unique phone hash (int_call_contract_bridge); ''-1'' = unresolved. Demo / test contracts excluded. claim_key
    = the claim a CLAIM_STATUS contact is about (NULL otherwise).

    '
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [call_key]
  columns:
  - name: call_key
    data_type: varchar
    data_tests: [unique, not_null]
  - name: call_id
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: call_at, data_type: timestamp}
  - name: call_date
    data_type: date
    data_tests: [not_null]
  - {name: call_date_key, data_type: integer}
  - {name: channel, data_type: varchar}
  - {name: queue, data_type: varchar}
  - name: reason
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [COMPLAINT, CANCEL_REQUEST, CLAIM_STATUS, COVERAGE_QUESTION, BILLING]
  - {name: disposition, data_type: varchar}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - name: contract_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_contract'), field: contract_key}
  - name: dealer_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_dealer'), field: dealer_key}
  - name: product_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_product'), field: product_key}
  - name: claim_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments: {to: ref('dim_claim'), field: claim_key}
  - name: contract_match_method
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [CONTRACT_NUMBER, PHONE_HASH, UNRESOLVED]
  - {name: is_complaint, data_type: boolean}
  - {name: complaint_category, data_type: varchar}
  - {name: is_regulator_referral, data_type: boolean}
  - {name: handle_seconds, data_type: integer}
  - {name: source_system, data_type: varchar}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_dealer_crosswalk
  description: 'Dealer master crosswalk: every source dealer identity (both systems) -> the surviving dealer_key
    in dim_dealer, with match_rule (self | number_base | name_state | unknown). Look a dealer up here by ANY of
    its numbers.

    '
  data_tests:
  - unique_combination:
      arguments:
        columns: [source_system, source_dealer_number]
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [dealer_crosswalk_key]
  columns:
  - name: dealer_crosswalk_key
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: source_system, data_type: varchar}
  - {name: source_dealer_id, data_type: bigint}
  - {name: source_dealer_number, data_type: varchar}
  - name: dealer_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_dealer'), field: dealer_key}
  - {name: surviving_dealer_number, data_type: varchar}
  - name: match_rule
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [self, number_base, name_state, unknown]
  - {name: is_survivor, data_type: boolean}
  - {name: is_source_active, data_type: boolean}
  - {name: identities_in_cluster, data_type: bigint}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_producer
  description: 'Producer with an explicit producer_role: selling_dealer (producer_key = dealer_key) or provider_entity
    (producer_key = obligor_key). dim_contract carries both roles by name (selling_dealer_key, provider_entity_key),
    so a "producer" filter can never pick the wrong one.

    '
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [producer_key]
  columns:
  - name: producer_key
    data_type: varchar
    data_tests: [unique, not_null]
  - name: producer_role
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [selling_dealer, provider_entity, unknown]
  - {name: producer_code, data_type: varchar}
  - {name: producer_name, data_type: varchar}
  - {name: state, data_type: varchar}
  - name: tenant_key
    data_type: bigint
    data_tests:
    - relationships:
        arguments: {to: ref('dim_tenant'), field: tenant_key}
  - {name: _built_at, data_type: timestamp with time zone}
- name: mart_unknown_member_share
  description: 'Orphans made visible: rows on the ''-1'' unknown member per core fact x foreign key. tests/core/core_unknown_member_share
    fails the build when a gated key (contract, dealer, product) exceeds var max_unknown_member_share.

    '
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [unknown_member_share_key]
  columns:
  - name: unknown_member_share_key
    data_type: varchar
    data_tests: [unique, not_null]
  - {name: model_name, data_type: varchar}
  - {name: key_column, data_type: varchar}
  - {name: dimension, data_type: varchar}
  - {name: row_count, data_type: bigint}
  - {name: unknown_rows, data_type: bigint}
  - name: unknown_share
    data_type: double
    data_tests: [not_null]
  - {name: is_gated, data_type: boolean}
  - {name: _built_at, data_type: timestamp with time zone}

- name: dim_participation_entity_program
  description: Participation entity x program type (V6 edit 13); contracts ceded vs retained after run-off.
  config:
    contract: {enforced: true}
  constraints:
  - type: primary_key
    columns: [participation_entity_program_key]
  columns:
  - name: participation_entity_program_key
    data_type: varchar
    data_tests: [unique, not_null]
  - name: participation_entity_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_participation_entity'), field: participation_entity_key}
  - {name: program_type, data_type: varchar, data_tests: [not_null]}
  - {name: status, data_type: varchar}
  - {name: runoff_date, data_type: date}
  - {name: cession_type, data_type: varchar}
  - {name: contracts, data_type: bigint}
  - {name: contracts_ceded, data_type: bigint}
  - {name: contracts_retained, data_type: bigint}
  - {name: first_entered_date, data_type: date}
  - {name: last_entered_date, data_type: date}
  - {name: _built_at, data_type: timestamp with time zone}
