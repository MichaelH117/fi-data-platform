  - {name: product_base_name, data_type: varchar}
  - name: program_type
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments: {values: [FULL_INSURED, AGENCY, PASS_THROUGH, UNKNOWN]}
  - name: compliance_family
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments: {values: [VSC, GAP, MAINTENANCE, ANCILLARY_OTHER, UNMAPPED]}
  - {name: short_code, data_type: varchar}
  - {name: is_cancellable, data_type: boolean}
  - {name: contract_prefix, data_type: varchar}
  - {name: deductible_amount, data_type: double}
  - {name: deductible_name, data_type: varchar}
  - {name: tier_rank, data_type: integer}
  - {name: _built_at, data_type: timestamp with time zone}
- name: dim_account_holder
