  description: 'Contract x month earning and claims (accident-month basis). Kept for actuarial/. row_type EARN is
    one row per contract x month; VOID_REVERSAL reverses a contract voided after activation; WRITTEN_CATCH_UP books
    a later AMEND (written + its share of months already booked) in the AMEND''s posting period, so an AMEND never
    re-prices a closed period. posting_period_key is where the month is booked (catch-up into the first open period
    when the month was closed at activation); month_start / earned_month_key is the month being earned.

    '
  columns:
  - name: contract_month_key
