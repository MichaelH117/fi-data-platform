# Server-target stack for the VSC data platform.
#
# STATUS: written and documented, NOT TESTED. The development machine has no Docker, so this file
# has never been brought up. The supported path today is the serverless local run:
#     python -m pipeline.run
#
# Services (all optional; pick with profiles):
#   warehouse   Postgres 16, the server warehouse target (dbt target `postgres`, RLS)  [default]
#   source      SQL Server 2022, the server stand-in for the Admin Core OLTP (SQLite locally) [--profile source]
#   airflow     Airflow 3 (LocalExecutor) api-server + scheduler + dag-processor       [--profile airflow]
#   superset    Superset dashboards on the marts                                       [--profile bi]
#
#   docker compose up -d                                   # warehouse only
#   docker compose --profile airflow --profile bi up -d    # full stack
#
# Credentials below are local-dev placeholders. Override them in a git-ignored .env file.

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: [{ path: .env, required: false }]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/pipeline/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@warehouse:5432/airflow
    VSC_REPO: /opt/airflow/repo
    DBT_TARGET: ${DBT_TARGET:-duckdb}
    WAREHOUSE_PATH: /opt/airflow/repo/data/warehouse/warehouse.duckdb
    DBT_RENDER: ${DBT_RENDER:-bash}
    # Standard libpq names: dbt's postgres target (dbt/profiles.yml) and psql read the same variables.
    PGHOST: warehouse
    PGUSER: ${PG_USER:-vsc}
    PGPASSWORD: ${PG_PASSWORD:-vsc_dev_only}
    PGDATABASE: ${PG_DATABASE:-vsc}
  volumes:
    - .:/opt/airflow/repo
  depends_on:
    warehouse: { condition: service_healthy }
  profiles: [airflow]

services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-vsc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-vsc_dev_only}
      POSTGRES_DB: ${PG_DATABASE:-vsc}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./warehouse/postgres/rls.sql:/docker-entrypoint-initdb.d/02_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Vsc_dev_only_1}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [mssql_data:/var/opt/mssql]
    profiles: [source]

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-api:
    <<: *airflow
    command: api-server
    ports: ["8080:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_me_dev_only}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports: ["8088:8088"]
    volumes:
      - ./docker/superset/superset_config.py:/app/superset_config.py:ro
      - ./data/warehouse:/app/warehouse:ro
    depends_on:
      warehouse: { condition: service_healthy }
    profiles: [bi]

volumes:
  pg_data:
  mssql_data:
