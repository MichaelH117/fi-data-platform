# Data contract: Admin Core (OLTP, SQLite standing in for SQL Server) -> raw_admin_core (bronze).
# Owner: Data Engineer. Consumers: Data Engineering Manager (dbt staging stg_admin_core__*).
#
# Replication = change tracking: `python -m ingest` pulls rows with row_version greater than the
# table's watermark (audit.ingest_watermark) and appends them to raw_admin_core.<table> with
# _loaded_at, _loaded_by, _source_system, _source_version (= row_version), _is_deleted
# (= removed_from_source = 1) and _run_id. Admin Core never hard deletes, so no key diff is needed.
# Tenancy: every table carries tenant_id; 0 = platform rows shared by every tenant (catalog,
# rates, obligors, insurers, reinsurers, repair facilities) and network intake rows.
# Every table also has created_at, updated_at, row_version and removed_from_source.
# columns: type and NOT NULL per column, generated from the DDL (generator/admin_core.py) with
# `python -m ingest.cdc --write-contract`; tests check that this file and the DDL agree exactly.
# Ingest enforces them: a value that does not cast to its declared type, or a NULL in a NOT NULL
# column, is not loaded but quarantined in raw_admin_core._quarantine (reject_reason type:<col> /
# null:<col>) and counted in audit.ingest_run.rows_quarantined.
# "transaction" is a reserved word in SQL: always quote it.
version: 1
source: admin_core
replication: {method: change_tracking, version_column: row_version, delete_flag: removed_from_source}
freshness: {warn_after_hours: 24, error_after_hours: 48}
